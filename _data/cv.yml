cv:
  name: 刘云飞
  label: 高级工程师 · 航天地面数据系统技术 / 空间应用大数据智能分析
  email: liuyunfei2026@gmail.com
  location: 北京，中国
  image: prof_pic.jpg
  summary: 计算机应用技术专业博士，现就职于中国科学院空间应用工程与技术中心。长期从事航天地面数据系统研制与空间应用大数据智能分析工作，作为核心技术骨干 / 副主任设计师，主持并参与天宫二号、中国空间站等多个ZRHT型号任务的地面数据系统设计、研制与运行保障；作为项目负责人，在知识图谱构建、多模态融合分析、领域大模型构建与智能体应用等方向取得多项原创性成果。

